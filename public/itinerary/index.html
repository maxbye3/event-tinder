<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Event Itinerary</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="stylesheet" href="/themes/background-grid.css" />
  <link rel="stylesheet" href="/itinerary/itinerary-page.css" />
</head>

<body>
  <main class="itinerary">
    <a class="itinerary__back" href="/">Back</a>
    <h1>YOUR ITINERARY</h1>
    <p class="itinerary__intro">
      These are the events you added by swiping right. Keep this tab open while you explore.
    </p>
    <div class="itinerary__empty" data-itinerary-empty hidden>
      No saved events yet. Swipe right on things you love to build your plan.
    </div>
    <div class="itinerary__list" data-itinerary-list></div>
    <div class="itinerary__email-bar">
      <button class="button button--primary itinerary__email-button" type="button" data-email-itinerary>
        Send itinerary to email
      </button>
    </div>
    <p class="itinerary__footer">
      Ready for more? Head back to the <a href="/">event feed</a> to keep exploring.
    </p>
  </main>
  <script src="/itinerary/EmailItinerary.js"></script>
  <script>
    (function () {
      const STORAGE_KEY = 'event-tinder-itinerary';
      const listEl = document.querySelector('[data-itinerary-list]');
      const emptyEl = document.querySelector('[data-itinerary-empty]');
      const emailButton = document.querySelector('[data-email-itinerary]');

      if (!listEl || !emptyEl) {
        return;
      }

      const safeText = (value, fallback = '') => {
        if (typeof value !== 'string') {
          return fallback;
        }
        const trimmed = value.trim();
        return trimmed.length > 0 ? trimmed : fallback;
      };

      const readItinerary = () => {
        try {
          const raw = window.sessionStorage.getItem(STORAGE_KEY);
          if (!raw) {
            return [];
          }
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          console.error('Failed to load itinerary from sessionStorage', error);
          return [];
        }
      };

      const createMetaText = (event) => {
        const parts = [];
        const date = safeText(event.date);
        const time = safeText(event.time);
        if (date) {
          parts.push(date);
        }
        if (time) {
          parts.push(time);
        }
        return parts.join(' • ');
      };

      const inferEventEdition = (event) => {
        const haystack = [
          event?.title,
          event?.venue,
          event?.address,
          event?.source,
          event?.description,
          event?.url,
        ].filter(Boolean).join(' ');

        if (/\b(london|uk|united kingdom|westminster|southbank|barbican|shoreditch|soho|camden|hackney|greenwich|londonist)\b/i.test(haystack)) {
          return { cityName: 'London', edition: 'London Edition' };
        }

        if (/\b(washington|dc|district of columbia|smithsonian|georgetown|dupont|capitol hill|downtown dc)\b/i.test(haystack)) {
          return { cityName: 'DC', edition: 'DC Edition' };
        }

        return { cityName: '', edition: '' };
      };

      const parseDateOnly = (value) => {
        if (typeof value !== 'string') {
          return null;
        }
        const match = value.trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) {
          return null;
        }
        const year = Number(match[1]);
        const month = Number(match[2]) - 1;
        const day = Number(match[3]);
        const date = new Date(year, month, day);
        date.setHours(0, 0, 0, 0);
        return Number.isNaN(date.getTime()) ? null : date;
      };

      const parseTimePart = (value) => {
        if (typeof value !== 'string') {
          return null;
        }
        const match = value.trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)$/i);
        if (!match) {
          return null;
        }
        let hours = Number(match[1]);
        const minutes = Number(match[2] ?? '0');
        const period = match[3].toUpperCase();

        if (hours < 1 || hours > 12 || minutes < 0 || minutes > 59) {
          return null;
        }

        if (hours === 12) {
          hours = 0;
        }

        if (period === 'PM') {
          hours += 12;
        }

        return { hours, minutes };
      };

      const parseTimeRange = (value) => {
        if (typeof value !== 'string' || value.trim().length === 0) {
          return null;
        }

        const parts = value.split('-').map((part) => part.trim()).filter((part) => part.length > 0);
        if (parts.length === 0) {
          return null;
        }

        const start = parseTimePart(parts[0]);
        const end = parts[1] ? parseTimePart(parts[1]) : null;

        if (!start) {
          return null;
        }

        return { start, end };
      };

      const formatForCalendar = (date) => {
        if (!(date instanceof Date) || Number.isNaN(date.getTime())) {
          return null;
        }
        const pad = (num) => String(num).padStart(2, '0');
        return [
          date.getUTCFullYear(),
          pad(date.getUTCMonth() + 1),
          pad(date.getUTCDate()),
          'T',
          pad(date.getUTCHours()),
          pad(date.getUTCMinutes()),
          '00Z',
        ].join('');
      };

      const escapeIcsText = (value) => safeText(value)
        .replace(/\\/g, '\\\\')
        .replace(/\n/g, '\\n')
        .replace(/,/g, '\\,')
        .replace(/;/g, '\\;');

      const buildCalendarDetails = (event) => {
        const lines = [];
        const meta = createMetaText(event);
        const description = safeText(event.description);
        const url = safeText(event.url);

        if (description) {
          lines.push(description);
        }

        if (meta) {
          lines.push(meta);
        }

        if (url) {
          lines.push(`More info: ${url}`);
        }

        return lines.join('\n\n');
      };

      const getEventCalendarRange = (event) => {
        const baseDate = parseDateOnly(event.date);
        const range = parseTimeRange(event.time);
        let startDateTime = null;
        let endDateTime = null;

        if (baseDate) {
          const start = new Date(baseDate);
          if (range?.start) {
            start.setHours(range.start.hours, range.start.minutes, 0, 0);
          }

          startDateTime = start;

          const end = new Date(baseDate);

          if (range?.end) {
            end.setHours(range.end.hours, range.end.minutes, 0, 0);
          } else if (range?.start) {
            end.setTime(start.getTime() + 60 * 60 * 1000);
          } else {
            end.setDate(end.getDate() + 1);
          }

          if (end <= start) {
            end.setTime(start.getTime() + 60 * 60 * 1000);
          }

          endDateTime = end;
        }

        return { startDateTime, endDateTime };
      };

      const buildIcsHref = (event) => {
        const { startDateTime, endDateTime } = getEventCalendarRange(event);
        const startToken = startDateTime ? formatForCalendar(startDateTime) : null;
        const endToken = endDateTime ? formatForCalendar(endDateTime) : null;

        if (!startToken || !endToken) {
          return null;
        }

        const locationParts = [safeText(event.venue), safeText(event.address)].filter((chunk) => chunk);
        const details = buildCalendarDetails(event);
        const uid = `${safeText(event.savedAt, String(Date.now()))}-${safeText(event.title, 'event')}`
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-|-$/g, '');
        const nowToken = formatForCalendar(new Date());
        const { edition } = inferEventEdition(event);
        const lines = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          `PRODID:-//Event Tinder//${edition || 'Events'}//EN`,
          'CALSCALE:GREGORIAN',
          'METHOD:PUBLISH',
          'BEGIN:VEVENT',
          `UID:${uid || Date.now()}@event-tinder`,
          `DTSTAMP:${nowToken}`,
          `DTSTART:${startToken}`,
          `DTEND:${endToken}`,
          `SUMMARY:${escapeIcsText(safeText(event.title, 'Saved event'))}`,
        ];

        if (details) {
          lines.push(`DESCRIPTION:${escapeIcsText(details)}`);
        }

        if (locationParts.length > 0) {
          lines.push(`LOCATION:${escapeIcsText(locationParts.join(', '))}`);
        }

        lines.push('END:VEVENT', 'END:VCALENDAR');

        return `data:text/calendar;charset=utf-8,${encodeURIComponent(lines.join('\r\n'))}`;
      };

      const buildCalendarUrl = (event) => {
        const params = new URLSearchParams({ action: 'TEMPLATE' });
        const title = safeText(event.title, 'Saved event');
        params.set('text', title);

        const { startDateTime, endDateTime } = getEventCalendarRange(event);
        const startToken = startDateTime ? formatForCalendar(startDateTime) : null;
        const endToken = endDateTime ? formatForCalendar(endDateTime) : null;

        if (startToken && endToken) {
          params.set('dates', `${startToken}/${endToken}`);
        } else {
          return null;
        }

        const timeZone = Intl?.DateTimeFormat?.().resolvedOptions?.().timeZone;
        if (typeof timeZone === 'string' && timeZone.length > 0) {
          params.set('ctz', timeZone);
        }

        const details = buildCalendarDetails(event);
        if (details) {
          params.set('details', details);
        }

        const locationParts = [safeText(event.venue), safeText(event.address)].filter((chunk) => chunk);
        if (locationParts.length > 0) {
          params.set('location', locationParts.join(', '));
        }

        params.set('sf', 'true');

        return `https://calendar.google.com/calendar/render?${params.toString()}`;
      };

      const buildOutlookUrl = (event) => {
        const { startDateTime, endDateTime } = getEventCalendarRange(event);
        if (!startDateTime || !endDateTime) {
          return null;
        }

        const params = new URLSearchParams();
        params.set('path', '/calendar/action/compose');
        params.set('rru', 'addevent');
        params.set('subject', safeText(event.title, 'Saved event'));
        params.set('startdt', startDateTime.toISOString());
        params.set('enddt', endDateTime.toISOString());

        const details = buildCalendarDetails(event);
        if (details) {
          params.set('body', details);
        }

        const locationParts = [safeText(event.venue), safeText(event.address)].filter((chunk) => chunk);
        if (locationParts.length > 0) {
          params.set('location', locationParts.join(', '));
        }

        return `https://outlook.live.com/calendar/0/deeplink/compose?${params.toString()}`;
      };

      const buildYahooUrl = (event) => {
        const { startDateTime, endDateTime } = getEventCalendarRange(event);
        const startToken = startDateTime ? formatForCalendar(startDateTime).replace(/00Z$/, '00Z') : null;
        if (!startDateTime || !endDateTime || !startToken) {
          return null;
        }

        const durationMinutes = Math.max(30, Math.round((endDateTime - startDateTime) / 60000));
        const hours = String(Math.floor(durationMinutes / 60)).padStart(2, '0');
        const minutes = String(durationMinutes % 60).padStart(2, '0');
        const params = new URLSearchParams();
        params.set('v', '60');
        params.set('title', safeText(event.title, 'Saved event'));
        params.set('st', startToken);
        params.set('dur', `${hours}${minutes}`);

        const details = buildCalendarDetails(event);
        if (details) {
          params.set('desc', details);
        }

        const locationParts = [safeText(event.venue), safeText(event.address)].filter((chunk) => chunk);
        if (locationParts.length > 0) {
          params.set('in_loc', locationParts.join(', '));
        }

        return `https://calendar.yahoo.com/?${params.toString()}`;
      };

      const clearModal = () => {
        document.querySelector('[data-itinerary-modal]')?.remove();
      };

      const createModal = (title) => {
        clearModal();

        const overlay = document.createElement('div');
        overlay.className = 'itinerary-modal';
        overlay.dataset.itineraryModal = 'true';

        const panel = document.createElement('section');
        panel.className = 'itinerary-modal__panel';
        panel.setAttribute('role', 'dialog');
        panel.setAttribute('aria-modal', 'true');
        panel.setAttribute('aria-label', title);
        overlay.appendChild(panel);

        const heading = document.createElement('h2');
        heading.textContent = title;
        panel.appendChild(heading);

        const actions = document.createElement('div');
        actions.className = 'itinerary-modal__actions';
        panel.appendChild(actions);

        const closeButton = document.createElement('button');
        closeButton.className = 'button button--tertiary';
        closeButton.type = 'button';
        closeButton.textContent = 'Close';
        closeButton.addEventListener('click', clearModal);
        panel.appendChild(closeButton);

        overlay.addEventListener('click', (clickEvent) => {
          if (clickEvent.target === overlay) {
            clearModal();
          }
        });

        document.body.appendChild(overlay);

        return actions;
      };

      const appendModalLink = (container, label, href, options = {}) => {
        if (!href) {
          return;
        }

        const link = document.createElement('a');
        link.className = 'button button--primary';
        link.href = href;
        link.textContent = label;

        if (options.download) {
          link.download = options.download;
        } else {
          link.target = '_blank';
          link.rel = 'noreferrer noopener';
        }

        container.appendChild(link);
      };

      const openCalendarModal = (event) => {
        const actions = createModal('Add to calendar');
        const icsHref = buildIcsHref(event);
        const icsDownloadName = `${safeText(event.title, 'event').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'event'}.ics`;

        appendModalLink(actions, 'Apple / Outlook', icsHref, { download: icsDownloadName });
        appendModalLink(actions, 'Google', buildCalendarUrl(event));
        appendModalLink(actions, 'Outlook.com', buildOutlookUrl(event));
        appendModalLink(actions, 'Yahoo', buildYahooUrl(event));
      };

      const createShareText = (event) => {
        const parts = [
          safeText(event.title, 'Saved event'),
          createMetaText(event),
          [safeText(event.venue), safeText(event.address)].filter((chunk) => chunk).join(', '),
          safeText(event.url),
        ].filter((chunk) => chunk);

        return parts.join('\n');
      };

      const copyShareText = async (event) => {
        const text = createShareText(event);
        try {
          await navigator.clipboard.writeText(safeText(event.url) || text);
          return true;
        } catch {
          return false;
        }
      };

      const shareEvent = async (event) => {
        if (navigator.share) {
          try {
            await navigator.share({
              title: safeText(event.title, 'Event Tinder event'),
              text: createShareText(event),
              url: safeText(event.url) || window.location.href,
            });
            return;
          } catch (shareError) {
            if (shareError?.name !== 'AbortError') {
              console.warn('Native share failed', shareError);
            }
          }
        }

        await copyShareText(event);
      };

      const writeItinerary = (nextItems) => {
        try {
          window.sessionStorage.setItem(STORAGE_KEY, JSON.stringify(nextItems));
        } catch (error) {
          console.error('Failed to update itinerary in sessionStorage', error);
        }
      };

      const refreshEmptyState = (items) => {
        emptyEl.hidden = items.length > 0;
      };

      const updateEmailButtonState = (items) => {
        if (!emailButton) {
          return;
        }
        emailButton.disabled = items.length === 0;
      };

      const renderEventCard = (event, items) => {
        const card = document.createElement('article');
        card.className = 'itinerary-card';

        const titleEl = document.createElement('h2');
        titleEl.textContent = safeText(event.title, 'Saved event');
        card.appendChild(titleEl);

        const metaText = createMetaText(event);
        if (metaText) {
          const metaEl = document.createElement('p');
          metaEl.className = 'itinerary-card__meta';
          metaEl.textContent = metaText;
          card.appendChild(metaEl);
        }

        const venue = safeText(event.venue);
        const address = safeText(event.address);
        if (venue || address) {
          const venueEl = document.createElement('p');
          venueEl.className = 'itinerary-card__venue';
          if (venue) {
            const strong = document.createElement('strong');
            strong.textContent = venue;
            venueEl.appendChild(strong);
            if (address) {
              venueEl.appendChild(document.createElement('br'));
            }
          }
          if (address) {
            venueEl.appendChild(document.createTextNode(address));
          }
          card.appendChild(venueEl);
        }

        const actionsContainer = document.createElement('div');
        actionsContainer.className = 'itinerary-card__actions';
        card.appendChild(actionsContainer);

        const url = safeText(event.url);
        if (url) {
          const linkEl = document.createElement('a');
          linkEl.className = 'button button--primary';
          linkEl.href = url;
          linkEl.target = '_blank';
          linkEl.rel = 'noreferrer noopener';
          linkEl.textContent = 'View details';
          actionsContainer.appendChild(linkEl);
        } else {
          const detailsButton = document.createElement('button');
          detailsButton.className = 'button button--primary';
          detailsButton.type = 'button';
          detailsButton.disabled = true;
          detailsButton.textContent = 'View details';
          actionsContainer.appendChild(detailsButton);
        }

        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.className = 'button button--tertiary';
        removeButton.textContent = 'Remove';
        removeButton.addEventListener('click', () => {
          const nextItems = items.filter((item) => item.savedAt !== event.savedAt);
          writeItinerary(nextItems);
          items.splice(0, items.length, ...nextItems);
          card.remove();
          refreshEmptyState(nextItems);
          updateEmailButtonState(nextItems);
        });

        actionsContainer.appendChild(removeButton);

        const calendarButton = document.createElement('button');
        calendarButton.type = 'button';
        calendarButton.className = 'button button--secondary';
        calendarButton.textContent = 'Add to calendar';
        calendarButton.addEventListener('click', () => openCalendarModal(event));
        actionsContainer.appendChild(calendarButton);

        const shareButton = document.createElement('button');
        shareButton.type = 'button';
        shareButton.className = 'button button--primary';
        shareButton.textContent = 'Share';
        shareButton.addEventListener('click', () => shareEvent(event));
        actionsContainer.appendChild(shareButton);

        return card;
      };

      let itinerary = readItinerary();
      if (!Array.isArray(itinerary)) {
        itinerary = [];
      }

      refreshEmptyState(itinerary);
      updateEmailButtonState(itinerary);

      if (itinerary.length > 0) {
        itinerary
          .slice()
          .sort((a, b) => new Date(b.savedAt || 0) - new Date(a.savedAt || 0))
          .forEach((event) => {
            const card = renderEventCard(event, itinerary);
            listEl.appendChild(card);
          });
      }

      if (emailButton) {
        emailButton.addEventListener('click', async () => {
          const items = readItinerary();
          if (items.length === 0) {
            return;
          }
          if (window.EmailItinerary && typeof window.EmailItinerary.send === 'function') {
            const wasSent = await window.EmailItinerary.send(items);
            if (wasSent) {
              const previousText = emailButton.textContent;
              emailButton.textContent = 'Email draft opened';
              window.setTimeout(() => {
                emailButton.textContent = previousText;
              }, 2200);
            }
          }
        });
      }
    })();
  </script>
</body>

</html>
